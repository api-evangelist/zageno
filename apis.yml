aid: zageno
name: Zageno
description: >-
  ZAGENO is a multi-supplier e-commerce marketplace and procurement platform for
  pharma and life-science R&D labs. It lets scientists search, compare, and order
  more than 50 million SKUs from over 6,000 global suppliers through a single
  consolidated catalog and checkout, with real-time availability, spend
  visibility, and automated approval workflows. ZAGENO connects into enterprise
  procure-to-pay and ERP systems (Coupa, SAP Ariba, Jaggaer, Procurify, NetSuite,
  QuickBooks and more) through a single PunchOut/cXML catalog integration rather
  than a public developer API. Founded in 2015 and headquartered in Cambridge,
  Massachusetts, it is backed by General Catalyst, Grazia Equity, and Capnamic
  Ventures.
